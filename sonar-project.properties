# SonarQube / SonarCloud project metadata
sonar.projectKey=oscilla-animator-v2
sonar.projectName=oscilla-animator-v2
sonar.projectVersion=1.0

# Source layout
sonar.sources=src,scripts
sonar.tests=src
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.spec.ts
sonar.exclusions=dist/**,node_modules/**,coverage/**,target/**

# Language settings
sonar.sourceEncoding=UTF-8

# Optional (set in CI/environment)
# sonar.host.url=https://sonarcloud.io
# sonar.token=${SONAR_TOKEN}
