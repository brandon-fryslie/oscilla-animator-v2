name: Complexity Analysis

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: complexity-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  complexity:
    name: Run complexity toolchain
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complexity analysis
        run: pnpm -s complexity:all

      - name: Prepare complexity HTML artifact
        id: complexity_html_artifact
        run: |
          SOURCE_HTML="reports/complexity/comparison-summary.html"
          TARGET_HTML="artifacts/complexity-${GITHUB_SHA}-comparison.html"
          mkdir -p artifacts
          cp "$SOURCE_HTML" "$TARGET_HTML"
          echo "path=$TARGET_HTML" >> "$GITHUB_OUTPUT"

      - name: Upload complexity comparison HTML
        uses: actions/upload-artifact@v4
        with:
          name: complexity-comparison-${{ github.sha }}
          path: ${{ steps.complexity_html_artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  compare-base-vs-head:
    name: Compare PR base vs head complexity
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PR base vs head comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          node scripts/complexity/commit-delta.mjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --output-dir artifacts/compare

      - name: Prepare comparison HTML artifact
        id: html_artifact
        run: |
          LATEST_DIR="$(cat artifacts/compare/latest.txt)"
          SOURCE_HTML="artifacts/compare/${LATEST_DIR}/commit-delta.html"
          TARGET_HTML="artifacts/complexity-pr-${{ github.event.pull_request.number }}-base-vs-head.html"
          cp "$SOURCE_HTML" "$TARGET_HTML"
          echo "path=$TARGET_HTML" >> "$GITHUB_OUTPUT"

      - name: Upload PR base-vs-head comparison HTML
        id: upload_html_artifact
        uses: actions/upload-artifact@v4
        with:
          name: complexity-pr-base-vs-head-${{ github.event.pull_request.number }}
          path: ${{ steps.html_artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Add comparison to job summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ steps.upload_html_artifact.outputs.artifact-url }}
        run: |
          LATEST_DIR="$(cat artifacts/compare/latest.txt)"
          node scripts/complexity/render-github-summary.mjs \
            --delta-json "artifacts/compare/${LATEST_DIR}/commit-delta.json" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --artifact-url "$ARTIFACT_URL" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce changed-file complexity thresholds
        run: |
          LATEST_DIR="$(cat artifacts/compare/latest.txt)"
          node scripts/complexity/assert-file-gates.mjs \
            --delta-json "artifacts/compare/${LATEST_DIR}/commit-delta.json"
