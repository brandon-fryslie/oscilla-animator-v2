name: webgpu-native-gates

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  headless-webgpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gate 1 + Gate 3 native tests
        run: scripts/run-native-webgpu-gates.sh
