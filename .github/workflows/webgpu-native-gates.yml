name: webgpu-native-gates

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: webgpu-native-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headless-webgpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gate 1 + Gate 3 native tests
        run: scripts/run-native-webgpu-gates.sh
