name: WebGPU Readiness

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Verify WebGPU readiness CI gate
        run: pnpm run -s ci:webgpu-readiness

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-readiness-report
          path: artifacts/webgpu-readiness.json
