name: WebGPU Readiness

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browser binaries
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate cached Playwright browser
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium

      - name: Verify WebGPU readiness CI gate
        env:
          WEBGPU_READINESS_INSTALL_PLAYWRIGHT: '0'
        run: pnpm run -s ci:webgpu-readiness

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-readiness-report
          path: artifacts/webgpu-readiness.json
          if-no-files-found: ignore

      - name: Upload browser matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-browser-matrix-report
          path: artifacts/webgpu-browser-matrix.json
          if-no-files-found: ignore
