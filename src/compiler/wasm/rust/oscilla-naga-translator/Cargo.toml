[package]
name = "oscilla-naga-translator"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# NOTE: naga 0.19 — the renderer uses naga 24.0. The rebuild workstream
# must align these versions. The DSL builds naga 0.19 AST nodes.
naga = { version = "0.19", features = ["wgsl-in", "wgsl-out"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dev-dependencies]
