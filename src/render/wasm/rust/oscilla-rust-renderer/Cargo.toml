[package]
name = "oscilla_rust_renderer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
naga = { version = "24.0", features = ["wgsl-in"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "24.0", default-features = false, features = ["webgpu", "wgsl"] }
web-sys = { version = "0.3", features = [
  "console",
  "DedicatedWorkerGlobalScope",
  "OffscreenCanvas",
  "Performance",
  "WorkerGlobalScope",
] }
