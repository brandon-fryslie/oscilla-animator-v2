[package]
name = "oscilla_rust_renderer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
naga = { version = "29.0.1", features = ["wgsl-in", "wgsl-out"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "29.0.1", default-features = false, features = ["webgpu", "wgsl", "naga-ir"] }
web-sys = { version = "0.3", features = [
  "console",
  "DedicatedWorkerGlobalScope",
  "OffscreenCanvas",
  "Performance",
  "WorkerGlobalScope",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
